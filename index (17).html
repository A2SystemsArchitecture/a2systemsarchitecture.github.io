<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ask Mr. Ray | A2 Watts</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy: #0a1628; --navy-mid: #1a2e50; --navy-deep: #0d1f3c;
    --orange: #f97316; --orange-light: #fb923c; --orange-glow: #ea580c;
    --white: #ffffff;
    --gray-50: #f8fafc; --gray-100: #f1f5f9; --gray-200: #e2e8f0;
    --gray-400: #94a3b8; --gray-800: #1e293b;
    --shadow: 0 20px 60px rgba(10,22,40,0.30); --radius: 22px;
  }
  body {
    font-family: 'Nunito', sans-serif;
    background: linear-gradient(135deg, #050e1f 0%, #0d1f3c 45%, #071429 100%);
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .app-wrapper {
    width: 100%; max-width: 480px; border-radius: var(--radius); overflow: hidden;
    box-shadow: var(--shadow), 0 0 0 1px rgba(249,115,22,0.18);
  }
  .chat-header {
    background: linear-gradient(135deg, #060f22 0%, #0f1e3a 100%);
    padding: 16px 18px 14px; display: flex; align-items: center; gap: 14px;
    border-bottom: 3px solid var(--orange);
  }
  .avatar-wrap { position: relative; flex-shrink: 0; width: 66px; height: 66px; }
  .avatar-ring {
    width: 66px; height: 66px; border-radius: 50%;
    background: linear-gradient(135deg, var(--orange) 0%, var(--orange-glow) 100%);
    padding: 3px; box-shadow: 0 0 22px rgba(249,115,22,0.55);
    animation: pulse-ring 2.8s ease-in-out infinite;
  }
  @keyframes pulse-ring {
    0%,100% { box-shadow: 0 0 22px rgba(249,115,22,0.55); }
    50%      { box-shadow: 0 0 38px rgba(249,115,22,0.90); }
  }
  .avatar-ring img { width:100%; height:100%; border-radius:50%; object-fit:cover; object-position:center 10%; display:block; }
  .status-dot {
    position: absolute; bottom: 2px; right: 2px; width: 14px; height: 14px;
    background: #22c55e; border-radius: 50%; border: 2.5px solid #060f22;
    animation: blink 2s ease-in-out infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.45} }
  .header-text { flex: 1; }
  .header-title { font-family: 'Fredoka One', cursive; font-size: 1.55rem; color: var(--orange-light); line-height: 1; letter-spacing: 0.4px; }
  .header-sub { font-size: 0.7rem; color: #7eaadc; font-weight: 700; text-transform: uppercase; letter-spacing: 1.1px; margin-top: 3px; }
  .header-sub2 { font-size: 0.62rem; color: #f97316; font-weight: 700; text-transform: uppercase; letter-spacing: 1.1px; margin-top: 2px; }
  .edu-badge {
    background: rgba(249,115,22,0.14); border: 1.5px solid rgba(249,115,22,0.4);
    border-radius: 9px; padding: 4px 10px; font-size: 0.64rem; color: var(--orange-light);
    font-weight: 900; text-transform: uppercase; letter-spacing: 0.9px; white-space: nowrap;
  }
  .chat-window {
    background: var(--gray-50); height: 430px; overflow-y: auto;
    padding: 16px 14px; display: flex; flex-direction: column; gap: 13px; scroll-behavior: smooth;
  }
  .chat-window::-webkit-scrollbar { width: 4px; }
  .chat-window::-webkit-scrollbar-thumb { background: var(--gray-200); border-radius: 10px; }
  .session-label { text-align:center; font-size:.67rem; color:#94a3b8; font-weight:700; text-transform:uppercase; letter-spacing:1px; padding-bottom:4px; }
  .msg-row { display:flex; gap:8px; align-items:flex-end; animation:msg-in .32s cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes msg-in { from{opacity:0;transform:translateY(14px) scale(.94)} to{opacity:1;transform:translateY(0) scale(1)} }
  .msg-row.user { flex-direction:row-reverse; }
  .msg-av { width:36px; height:36px; border-radius:50%; flex-shrink:0; overflow:hidden; border:2px solid var(--orange); }
  .msg-av img { width:100%; height:100%; object-fit:cover; object-position:center 10%; }
  .msg-av-user { width:36px; height:36px; border-radius:50%; flex-shrink:0; background:linear-gradient(135deg,var(--navy-mid),#0a1e3d); border:2px solid #60a5fa; display:flex; align-items:center; justify-content:center; font-size:16px; }
  .bubble { max-width:78%; padding:11px 15px; border-radius:18px; font-size:.875rem; line-height:1.58; font-weight:600; }
  .bubble.mr-ray { background:var(--white); color:var(--gray-800); border-radius:4px 18px 18px 18px; box-shadow:0 2px 10px rgba(10,22,40,.09); border:1.5px solid var(--gray-200); }
  .bubble.user { background:linear-gradient(135deg,var(--navy-mid) 0%,#0d1f3c 100%); color:#fff; border-radius:18px 4px 18px 18px; box-shadow:0 2px 12px rgba(10,22,40,.35); }
  .bubble-name { font-size:.67rem; font-weight:900; text-transform:uppercase; letter-spacing:.9px; color:var(--orange); margin-bottom:4px; }
  .typing-bubble { background:var(--white); border-radius:4px 18px 18px 18px; padding:13px 16px; box-shadow:0 2px 10px rgba(10,22,40,.09); border:1.5px solid var(--gray-200); display:flex; gap:5px; align-items:center; }
  .tdot { width:7px; height:7px; background:var(--orange-light); border-radius:50%; animation:bounce 1.2s ease-in-out infinite; }
  .tdot:nth-child(2){animation-delay:.2s} .tdot:nth-child(3){animation-delay:.4s}
  @keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-7px)} }
  .quick-area { display:flex; flex-wrap:wrap; gap:6px; padding:10px 14px 12px; background:var(--gray-50); border-top:1px solid var(--gray-200); border-bottom:1px solid var(--gray-200); }
  .qbtn { background:var(--white); border:1.5px solid var(--gray-200); border-radius:20px; padding:5px 13px; font-family:'Nunito',sans-serif; font-size:.74rem; font-weight:800; color:var(--navy-mid); cursor:pointer; transition:all .15s; white-space:nowrap; }
  .qbtn:hover { background:var(--orange); color:#fff; border-color:var(--orange); transform:translateY(-1px); box-shadow:0 3px 10px rgba(249,115,22,.30); }
  .disclaimer { background:rgba(249,115,22,0.08); border-top:1px solid rgba(249,115,22,.2); padding:6px 14px; text-align:center; font-size:.66rem; color:#78716c; font-weight:700; letter-spacing:.4px; }
  .disclaimer span { color:var(--orange); }
  .input-area { background:var(--white); border-radius:0 0 var(--radius) var(--radius); padding:13px 14px; display:flex; gap:9px; align-items:flex-end; border-top:2px solid var(--gray-100); }
  .input-box { flex:1; background:var(--gray-100); border:2px solid var(--gray-200); border-radius:14px; padding:10px 13px; font-family:'Nunito',sans-serif; font-size:.875rem; font-weight:600; color:var(--gray-800); resize:none; outline:none; min-height:44px; max-height:110px; line-height:1.45; transition:border-color .2s,box-shadow .2s; }
  .input-box::placeholder { color:var(--gray-400); font-weight:600; }
  .input-box:focus { border-color:var(--orange-light); box-shadow:0 0 0 3px rgba(249,115,22,.14); background:#fff; }
  .send-btn { width:44px; height:44px; border-radius:13px; background:linear-gradient(135deg,var(--orange),var(--orange-glow)); border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:transform .15s,box-shadow .15s; box-shadow:0 4px 14px rgba(249,115,22,.40); }
  .send-btn:hover { transform:scale(1.08); box-shadow:0 6px 20px rgba(249,115,22,.58); }
  .send-btn:active { transform:scale(.95); }
  .send-btn:disabled { opacity:.45; cursor:not-allowed; transform:none; }
  .send-btn svg { width:18px; height:18px; fill:#fff; }
  .bubble p { margin-top:6px; } .bubble p:first-child { margin-top:0; }
  .bubble strong { color:#0a1628; } .bubble.user strong { color:#fff; }
  .error-bubble { background:#fff0f0; border:1.5px solid #fca5a5; border-radius:4px 18px 18px 18px; padding:11px 15px; font-size:.875rem; color:#dc2626; font-weight:600; max-width:78%; }
  @media(max-width:520px){ body{padding:0;align-items:flex-end;} .app-wrapper{max-width:100%;border-radius:16px 16px 0 0;} .chat-header{border-radius:16px 16px 0 0;} }
</style>
</head>

    <div class="header-text">
      <div class="header-title">Ask Mr. Ray</div>
      <div class="header-sub">Mater Bay Rays</div><div class="header-sub2">Educational Learning Guide</div>

  <div class="chat-window" id="chatWindow">
    <div class="session-label">Today's Learning Session</div>
  </div>

  <div class="quick-area" id="quickArea">
    <button class="qbtn" onclick="sendQuick('I need help with ELA')">ELA</button>
    <button class="qbtn" onclick="sendQuick('I need help with math')">Math</button>
    <button class="qbtn" onclick="sendQuick('I need help with science')">Science</button>
    <button class="qbtn" onclick="sendQuick('I need help with social studies')">Social Studies</button>
    <button class="qbtn" onclick="sendQuick('I need help with world languages')">World Languages</button>
  </div>



  <div class="input-area">
    <textarea class="input-box" id="inputBox" placeholder="Ask Mr. Ray anything… he'll help you learn! 🎓" rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
    </button>
  </div>
  <div class="disclaimer">
    <span>Mr. Ray</span> guides your thinking. Never hands out answers. Educational guidance only<br>Powered by A2 Watts
  </div>
</div>

<script>
const MR_RAY_SRC = document.getElementById('mrRayImg').src;

// Points to your Cloud Function — no key anywhere in this file
const PROXY_URL = 'https://chat-buetfcie6q-uc.a.run.app';

let history = [];
let busy = false;

function autoResize(el) { el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,110)+'px'; }
function handleKey(e) { if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();} }
function sendQuick(t) { document.getElementById('inputBox').value=t; document.getElementById('quickArea').style.display='none'; sendMessage(); }
function scrollBot() { const w=document.getElementById('chatWindow'); w.scrollTop=w.scrollHeight; }

function addMessage(role, text) {
  const win = document.getElementById('chatWindow');
  const row = document.createElement('div');
  row.className = 'msg-row '+(role==='user'?'user':'mr-ray');
  if(role==='assistant'){
    const av=document.createElement('div'); av.className='msg-av';
    const img=document.createElement('img'); img.src=MR_RAY_SRC; img.alt='Mr. Ray';
    av.appendChild(img); row.appendChild(av);
  } else {
    const av=document.createElement('div'); av.className='msg-av-user'; av.textContent='🎓'; row.appendChild(av);
  }
  const bub=document.createElement('div');
  bub.className='bubble '+(role==='user'?'user':'mr-ray');
  if(role==='assistant'){
    const nm=document.createElement('div'); nm.className='bubble-name'; nm.textContent='Mr. Ray'; bub.appendChild(nm);
  }
  const c=document.createElement('div');
  c.innerHTML=text.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\n\n/g,'</p><p style="margin-top:7px">').replace(/\n/g,'<br/>').replace(/^/,'<p>').replace(/$/,'</p>');
  bub.appendChild(c); row.appendChild(bub); win.appendChild(row); scrollBot();
}

function addError(text) {
  const win = document.getElementById('chatWindow');
  const row = document.createElement('div');
  row.className = 'msg-row mr-ray';
  const av=document.createElement('div'); av.className='msg-av';
  const img=document.createElement('img'); img.src=MR_RAY_SRC; img.alt='Mr. Ray';
  av.appendChild(img); row.appendChild(av);
  const bub=document.createElement('div'); bub.className='error-bubble';
  bub.textContent=text; row.appendChild(bub); win.appendChild(row); scrollBot();
}

function showTyping() {
  const win=document.getElementById('chatWindow');
  const row=document.createElement('div'); row.className='msg-row mr-ray'; row.id='typingRow';
  const av=document.createElement('div'); av.className='msg-av';
  const img=document.createElement('img'); img.src=MR_RAY_SRC; img.alt='Mr. Ray'; av.appendChild(img); row.appendChild(av);
  const d=document.createElement('div'); d.className='typing-bubble';
  d.innerHTML='<div class="tdot"></div><div class="tdot"></div><div class="tdot"></div>';
  row.appendChild(d); win.appendChild(row); scrollBot();
}
function removeTyping() { const el=document.getElementById('typingRow'); if(el)el.remove(); }

async function sendMessage() {
  if(busy) return;
  const inp=document.getElementById('inputBox');
  const txt=inp.value.trim(); if(!txt) return;
  document.getElementById('quickArea').style.display='none';
  addMessage('user',txt); inp.value=''; inp.style.height='auto';
  history.push({role:'user',content:txt});
  busy=true; document.getElementById('sendBtn').disabled=true; showTyping();
  try {
    const res = await fetch(PROXY_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history })
    });
    const data = await res.json(); removeTyping();
    if(!res.ok || data.error){
      addError('🐟 Oops — ' + (data.error || 'something went wrong') + '. Try again!');
      history.pop();
    } else {
      history.push({role:'assistant',content:data.reply});
      addMessage('assistant',data.reply);
    }
  } catch(err) {
    removeTyping();
    addError('🐟 Connection issue — check your internet and try again.');
    history.pop();
  }
  busy=false; document.getElementById('sendBtn').disabled=false; inp.focus();
}

async function greet() {
  showTyping(); await new Promise(r=>setTimeout(r,950)); removeTyping();
  const g="Hey there! I'm **Mr. Ray** — your personal learning guide at A2 Watts!\n\nHere's the deal: I won't just give you answers. Instead, I'll help you **figure things out yourself** — because that's how real learning sticks! 🎓\n\nWhether it's math, science, writing, history, or anything else — bring it to me and we'll work through it together. What are you working on today?";
  addMessage('assistant',g); history.push({role:'assistant',content:g});
}

greet();
</script>
